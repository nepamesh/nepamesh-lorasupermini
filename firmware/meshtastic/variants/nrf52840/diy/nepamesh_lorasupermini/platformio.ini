; NEPAMesh LoraSupermini v0.1: nRF52840 supermini + Seeed Wio-SX1262 carrier (private DIY build)
[env:nepamesh_lorasupermini]
extends = nrf52840_base
board_level = extra
board = promicro-nrf52840
build_flags = ${nrf52840_base.build_flags}
  -I variants/nrf52840/diy/nepamesh_lorasupermini
  -D PRIVATE_HW
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/diy/nepamesh_lorasupermini>
debug_tool = jlink
